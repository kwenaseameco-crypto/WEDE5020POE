<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styler.css">
    <title>Cart - Misunderstood World</title>
</head>


    <!-- Backdrop overlay for mobile menu-->
<body data-theme="light">
<header class="mw-header">
    <div class="logo">Misunderstood World</div>
    <nav class="mw-nav">
        <a href="/Webpages/Home.html">Home</a>
        <a href="/Webpages/Cart.html">Cart</a>
        <a href="/Webpages/Products.html">Products</a>
        <a href="/Webpages/Location.html">Location</a>
        <a href="/Webpages/Account.html">Account</a>
        <a href="/Webpages/Enquiry.html">Enquiry</a>
        <a href="/Webpages/Contact.html">Contact</a>
    </nav>
    <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
  </header>

    <div class="content">
        <h1>Misundertood World</h1>
    </div>

    <script>
        const hamburger = document.queryselector('.hamburger');
        const navlinks = document.queryselector('.nav-links');
        const menuBackdrop = document.queryselector('.menu-backdrop');

        hamburger.addeventListener('click', () => {
            hamburger.classlist.toggle('active');
            navLinks.classlist.toggle('active');
            menuBackdrop.classList.toggle('active');
        });
        // close menu when clicking on backdrop//
        menuBackdrop.addEventListener('click', () => {
            hamburger.classList.remove('active');
            navLinks.classList.remove('active');
            menuBackdrop.classList.remove('active');
        });

        // Close menu when clicking on a link
        document.querySelectorAll('nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classlist.remove('active');
                navLinks.classList.remove('active');
                menuBackdrop.classList.remove('active');
            });
        });
    </script>
    </head>

</html>
