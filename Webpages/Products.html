<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styler.css">
    <title>Misunderstood World</title>
</head>

<body data-theme="light">
<header class="mw-header">
    <div class="logo">Misunderstood World</div>
    <nav class="mw-nav">
        <a href="/Webpages/Home.html">Home</a>
        <a href="/Webpages/Cart.html">Cart</a>
        <a href="/Webpages/Products.html">Products</a>
        <a href="/Webpages/Location.html">Location</a>
        <a href="/Webpages/Account.html">Account</a>
        <a href="/Webpages/Enquiry.html">Enquiry</a>
        <a href="/Webpages/Contact.html">Contact</a>
    </nav>
    <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
  </header>

    <div class="product-grid">
        <div class="product-card">
            <div class="product-image">
                <img src="/Images/BlackTee.jpg" alt="Black Tee">
            </div>
            <div class="product-info">
                <h3 class="product-name">Star Tee</h3>
                <p class="product-price">R299.00</p>
                <button class="add-to-cart" onclick="addToCart('hoodie', 299.00)">Add to Cart</button>
            </div>
        </div>

        <div class="product-card">
            <div class="product-image">
                <img src="/Images/WhiteCaps.jpg" alt="White Misunderstood Cap">
            </div>
            <div class="product-info">
                <h3 class="product-name">Misunderstood Caps</h3>
                <p class="product-price">R219.00</p>
                <button class="add-to-cart" onclick="addToCart('cap', 219.00)">Add to Cart</button>
            </div>
        </div>

        <div class="product-card">
            <div class="product-image">
                <img src="/Images/Crew.jpg" alt="Brown Misunderstood Hoodie">
            </div>
            <div class="product-info">
                <h3 class="product-name">Misunderstood Hoodie</h3>
                <p class="product-price">R599.00</p>
                <button class="add-to-cart" onclick="addToCart('hoodie', 599.00)">Add to Cart</button>
            </div>
        </div>
        
        <div class="product-card">
            <div class="product-image">
                <img src="/Images/NeonLights.jpg" alt="Misunderstood Baseball Shirt">
            </div>
            <div class="product-info">
                <h3 class="product-name">Misunderstood Baseball Shirt</h3>
                <p class="product-price">R349.00</p>
                <button class="add-to-cart" onclick="addToCart('shirt', 349.00)">Add to Cart</button>
            </div>
        </div>

    </div>

    <script>
        function addToCart(productId, price) {
            console.log(`Added ${productId} to cart for R${price}`);
            // ctual cart logic
            alert(`Added to cart: R${price}`);
        }
    </script>

</body>

</html>
